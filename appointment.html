<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
<nav>
    <div class="logo">ZYAN HOSPITAL</div>
    <div class="menu">
        <a href="home.html">Home</a>
        <a href="About.html">About</a>
        <a href="services.html">Services</a>
        <a href="Contact.html">Contact</a>
    </div>
</nav>
<section class="appointment">
    <h1>Book Appointment</h1>
    <div class="formbox">
        <form onsubmit="bookAppointment(event)">
            <div class="form-row">
                <label>Email</label>
                <input type="email" name ="email" placeholder="Enter your email" required>
            </div>
            <div class="form-row">
                <label>Password</label>
                <input type="password" name ="password" placeholder ="Enter your password"
                pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*]).{6,}"
                title="Password must contain at least 6 characters, 1 uppercase letter, 
                1 lowercase letter, 1 number, and 1 special character"required>
            </div>
            <div class="form-row">
                <label>Name</label>
                <input type="text" name="name" placeholder="Enter your name" required>
            </div>
            <div class="form-row">
                <label>Phone No</label>
                <input type="tel" name="phone" placeholder="enter your phone number" maxlength="12" required>
            </div>
            <div class="form-row">
                <label>Gender</label>
                <div class="gender-options">
                    <label>
                        <input type="radio" name="gender" value="Male" required>
                        Male
                    </label>
                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>
                </div>
            </div>
            <div class="form-row">
                <label>Address</label>
                <textarea rows="3" name="address" placeholder="Enter your address" required></textarea>
            </div>
            <button>Submit</button>
        </form>
    </div>
</section>

</body>
</html>
